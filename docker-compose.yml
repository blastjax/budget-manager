services:
  redis:
    image: redis:7-alpine
    restart: always
    # Loopback-only: the api container reaches Redis over the compose network
    # by service name, so the published port exists purely so a backend run
    # directly on the host (`uvicorn main:app`) can share it. Binding to
    # 0.0.0.0 would expose an unauthenticated Redis on a public instance.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
      # Probe every second while still inside start_period rather than waiting
      # out the full `interval`. Steady-state probe load is unchanged - this
      # only changes how fast a freshly started container is first reported
      # healthy. That matters because redis -> api -> web is a serial
      # depends_on: service_healthy chain, so each one's start-up latency adds
      # directly to the deploy job's wall clock. Needs Docker Engine 25.0+;
      # the EC2 host is on 29.7.2.
      start_interval: 1s
  api:
    restart: always
    # image: pulled from GHCR on the EC2 host (see deploy.yml); the build:
    # block below is only exercised by a local `docker compose build`.
    image: ${API_IMAGE:-budgetapp-api}:latest
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    # Matches the image's own non-root user. Bind mounts keep host ownership,
    # so if ./data is owned by a different uid on some host, set API_UID /
    # API_GID in .env to match instead of rebuilding the image (API_UID=0
    # restores the old root behaviour).
    user: "${API_UID:-1000}:${API_GID:-1000}"
    # No host port publish - only reachable through Caddy (see below) or
    # from other containers on the compose network by service name.
    # Explicit allow-list instead of `env_file: .env` — the container only
    # ever gets exactly these variables, substituted from a root `.env` if
    # one exists (compose auto-loads it for ${...} interpolation; no file is
    # copied into the image or container). DATABASE_URL is fixed, not
    # user-configurable here, because it has to match the ./data bind mount
    # below — a value from .env pointing elsewhere would silently not
    # persist across restarts.
    environment:
      DATABASE_URL: sqlite:////app/data/budget.sqlite
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-300}
      BUDGET_CORS_ORIGINS: ${BUDGET_CORS_ORIGINS:-}
      BUDGET_OTP_SECRET: ${BUDGET_OTP_SECRET:-}
      BUDGET_SESSION_TTL_SECONDS: ${BUDGET_SESSION_TTL_SECONDS:-43200}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      # See the note on redis: fast probes during start-up only, so the deploy
      # doesn't sit through a 15s interval waiting on a process that was ready
      # in two.
      start_interval: 2s
  web:
    restart: always
    # image: pulled from GHCR on the EC2 host (see deploy.yml); the build:
    # block below is only exercised by a local `docker compose build`.
    image: ${WEB_IMAGE:-budgetapp-web}:latest
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    # No host port publish - only reachable through Caddy (see below).
    depends_on:
      api:
        condition: service_healthy
    # Node 20 has a global fetch, so this needs nothing installed in the image.
    # The deploy workflow gates on this reporting healthy.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      # See the note on redis: fast probes during start-up only, so the deploy
      # doesn't sit through a 15s interval waiting on a process that was ready
      # in two.
      start_interval: 2s
  caddy:
    restart: always
    image: caddy:2-alpine
    # Sole public entry point: terminates TLS (auto-provisions and renews
    # the Let's Encrypt cert for the domain in the Caddyfile) and routes
    # /api/* to the backend, everything else to the Next.js frontend.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  redisdata:
  caddy_data:
  caddy_config:
