name: Deploy to EC2
run-name: Deploy to EC2 (${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }})

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # api and web don't depend on each other, so build them on separate
    # runners in parallel instead of as two sequential steps on one runner.
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./docker/Dockerfile.backend
          - name: web
            context: ./web
            file: ./docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here instead of on the EC2 host: the runner has far more RAM/CPU
      # than the instance, so `next build` and the two images no longer
      # compete with each other (or the box's own memory limit) at deploy time.
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_URL={0}', secrets.NEXT_PUBLIC_API_URL || 'http://127.0.0.1:8000') || '' }}
          tags: |
            ${{ matrix.name == 'api' && env.API_IMAGE || env.WEB_IMAGE }}:latest
            ${{ matrix.name == 'api' && env.API_IMAGE || env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
      id-token: write
    # One deploy at a time; queue rather than cancel so a run that already
    # started updating the host is never interrupted half-way. Scoped to this
    # job (not the whole workflow) so concurrent pushes can still build in
    # parallel — only the SSM/host step is serialized.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    steps:
      # Direct SSH from GitHub-hosted (Azure) runners to this host started
      # timing out at the TCP level with no config on either side to
      # explain it (SG/NACL wide open, no host firewall, instance healthy —
      # a manual SSH from a residential IP worked fine seconds later). SSM
      # runs over HTTPS through AWS's own endpoints instead of a public
      # port-22 connection, so it isn't subject to whatever was dropping
      # that path, and it means port 22 no longer needs to be open at all.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          cat > /tmp/deploy.sh <<'SCRIPT'
          set -e
          cd ${{ secrets.APP_DIR }}

          # --ff-only: fail loudly on divergence instead of creating a merge
          # commit on the server or leaving a half-applied tree. Pulls the
          # ref that triggered this run (main on push, or whatever branch
          # was picked on a manual dispatch).
          git pull --ff-only origin ${{ github.ref_name }}

          # The api container runs as uid 1000 (see docker/Dockerfile.backend),
          # so the bind-mounted DB directory has to be writable by it. Also
          # fixes ownership left behind by older root-run containers.
          mkdir -p data
          chown -R 1000:1000 data

          # This run's GITHUB_TOKEN only, not a durable secret on the box:
          # it expires with the workflow run, so nothing long-lived to
          # revoke or rotate here. Images already pulled keep running fine
          # after it expires.
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          export API_IMAGE='${{ env.API_IMAGE }}'
          export WEB_IMAGE='${{ env.WEB_IMAGE }}'
          export WEB_PORT='${{ secrets.WEB_PORT || 3000 }}'
          export BUDGET_CORS_ORIGINS='${{ secrets.BUDGET_CORS_ORIGINS }}'
          export BUDGET_OTP_SECRET='${{ secrets.BUDGET_OTP_SECRET }}'
          # --policy always: api/web define both `image:` and `build:` (the
          # build: block is for local `docker compose build` only, per
          # docker/README.md), so a plain `pull` skips them as "buildable"
          # and `up` then falls back to building web's `next build` on this
          # box - slow enough to blow a tight command budget.
          # This flag forces the actual GHCR image to be pulled instead.
          docker compose pull --policy always api web
          docker compose up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io

          # Fail the job if the stack doesn't come up, so a red check means
          # "not deployed" rather than "deployed and broken". Reuses the
          # healthchecks already defined in docker-compose.yml, which keeps
          # this free of any host-side curl/wget dependency.
          for service in api web; do
            cid=$(docker compose ps -q "$service")
            if [ -z "$cid" ]; then
              echo "$service container is not running" >&2
              docker compose logs --tail 50 "$service" >&2 || true
              exit 1
            fi
            healthy=""
            for _ in $(seq 1 40); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)
              if [ "$status" = "healthy" ]; then
                healthy=1
                break
              fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "$service did not become healthy (last status: ${status:-unknown})" >&2
              docker compose logs --tail 50 "$service" >&2 || true
              exit 1
            fi
            echo "$service is healthy"
          done
          SCRIPT

          jq -Rs '{"commands": [.]}' /tmp/deploy.sh > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 1800 \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          # Poll for up to 30 minutes, matching the previous command_timeout:
          # git pull and the GHCR login/pull alone have each taken several
          # minutes on this instance, so the script needs real headroom.
          STATUS="Pending"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "Final status: $STATUS"
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command finished with status: $STATUS" >&2
            exit 1
          fi
